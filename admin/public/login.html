<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 로그인 · HOHO WORKS</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/login.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="/admin" lang="en">HOHO WORKS</a>
  </header>
  <main class="login-layout">
    <form id="login-form" action="/api/login" method="post">
      <header class="section-header"><h1>관리자 로그인</h1></header>
      <label for="code">접속 코드</label>
      <input id="code" type="password" name="code" autocomplete="current-password" autocapitalize="off" spellcheck="false" aria-describedby="login-error" required autofocus>
      <button id="login-submit" class="primary" type="submit">로그인 <span aria-hidden="true">→</span></button>
      <p class="error" id="login-error" role="alert"></p>
    </form>
  </main>
</body>
</html>
